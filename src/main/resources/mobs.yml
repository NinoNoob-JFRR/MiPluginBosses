# ============================================================
# MiPluginBosses - Mob Tiers
# ============================================================
# Todos los mobs hostiles/neutrales agresivos reciben un tier.
# Se excluyen animales pasivos, aldeanos y mobs del plugin.
# El tier se guarda en el PDC del mob y se aplica al spawnear.
# ============================================================

mobs:
  enabled: true

  # Distribucion global (no depende de distancia ni progreso).
  # Debe sumar 100.
  distribution:
    1: 30
    2: 20
    3: 15
    4: 10
    5: 8
    6: 6
    7: 4
    8: 3
    9: 2
    10: 2

  # Multiplicadores sobre los stats base del mob.
  # health/damage/speed/xp son multiplicadores.
  # armor/toughness son valores sumados.
  # stats-multiplier escala health/damage/armor/toughness/xp de todos los
  # tiers a la vez (3.0 = tres veces mas poderosos). No afecta a la velocidad.
  stats-multiplier: 3.0
  stats:
    1:  { health: 1.00, damage: 1.00, armor: 0.0, toughness: 0.0, speed: 0.00, xp: 1.00 }
    2:  { health: 1.33, damage: 1.11, armor: 1.0, toughness: 0.6, speed: 0.02, xp: 1.56 }
    3:  { health: 1.67, damage: 1.22, armor: 2.0, toughness: 1.1, speed: 0.04, xp: 2.11 }
    4:  { health: 2.00, damage: 1.33, armor: 3.0, toughness: 1.7, speed: 0.06, xp: 2.67 }
    5:  { health: 2.33, damage: 1.44, armor: 4.0, toughness: 2.2, speed: 0.08, xp: 3.22 }
    6:  { health: 2.67, damage: 1.56, armor: 5.0, toughness: 2.8, speed: 0.10, xp: 3.78 }
    7:  { health: 3.00, damage: 1.67, armor: 6.0, toughness: 3.3, speed: 0.12, xp: 4.33 }
    8:  { health: 3.33, damage: 1.78, armor: 7.0, toughness: 3.9, speed: 0.14, xp: 4.89 }
    9:  { health: 3.67, damage: 1.89, armor: 8.0, toughness: 4.4, speed: 0.16, xp: 5.44 }
    10: { health: 4.00, damage: 2.00, armor: 9.0, toughness: 5.0, speed: 0.18, xp: 6.00 }

  # Formato del nombre visible.
  # Placeholders: %color% %tier% %name% %health% %max_health%
  name:
    always-show: true
    format: "%color%[T%tier%] &f%name% &c%health%&7/&c%max_health%"
    update-on:
      - DAMAGE
      - HEAL

  # Que mobs reciben tier.
  targeting:
    categories:
      - MONSTER
      - GOLEM
      - SLIME
    # Neutrales que atacan o pueden ser atacados.
    extra-types:
      - WOLF
      - BEE
      - ENDERMAN
      - PIGLIN
      - ZOMBIFIED_PIGLIN
      - HOGLIN
      - ZOGLIN
      - POLAR_BEAR
      - ENDER_DRAGON
      - WITHER
      - WARDEN
      - ELDER_GUARDIAN
    # Nunca reciben tier.
    exclude-types:
      - VILLAGER
      - WANDERING_TRADER
      - SNOW_GOLEM
      - ALLAY
      - AXOLOTL
      - BAT
      - CAT
      - CHICKEN
      - COD
      - COW
      - DONKEY
      - FOX
      - FROG
      - GLOW_SQUID
      - HORSE
      - MULE
      - MUSHROOM_COW
      - OCELOT
      - PARROT
      - PIG
      - PUFFERFISH
      - RABBIT
      - SALMON
      - SHEEP
      - SQUID
      - STRIDER
      - TADPOLE
      - TROPICAL_FISH
      - TURTLE
    # Lobos domesticados no reciben tier.
    exclude-tamed: true
    # Los jefes del plugin usan su propio sistema.
    exclude-plugin-bosses: true

  # Los jefes vanilla usan el multiplicador completo del tier.
  vanilla-bosses:
    use-full-multiplier: true
    types:
      - ENDER_DRAGON
      - WITHER
      - WARDEN
      - ELDER_GUARDIAN

  storage:
    type: PDC
    key: "mob_tier"
    # Se calcula una sola vez, al spawnear.
    roll-on-spawn: true
    # Al cargar chunks solo se aplican stats si el PDC ya tiene tier.
    apply-on-chunk-load: true
