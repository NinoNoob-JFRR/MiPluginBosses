# ============================================================
# MiPluginBosses - Esencias de habilidad (27)
# ============================================================
# Cada bloque es autocontenido: mecanica, niveles, coste, lore
# y referencia a la receta en recipes.yml.
#
# type:
#   PASSIVE -> se aplica al equipo (apply_to: GEAR)
#   ACTIVE  -> se aplica a un libro (apply_to: BOOK)
#
# cost.per:
#   TRIGGER -> cada activacion
#   Xs      -> cada X segundos mientras esta activa
#
# Sin cooldowns. El coste es el unico limitador.
# Si el jugador no puede pagar, la habilidad no se activa
# y no se muestra ningun mensaje de fallo.
#
# Si un nivel define food_cost, ese valor tiene prioridad
# sobre cost.amount (usado por TreeFeller, RepairItem y Fly).
#
# El coste final de comida se multiplica por
# config.yml -> abilities.food-cost-multiplier (0.5 = la mitad).
# Los costes positivos nunca bajan de 1.
# ============================================================

