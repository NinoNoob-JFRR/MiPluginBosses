# ============================================================
# MiPluginBosses - Drops de jefes
# ============================================================
# Los drops son libres para todos (FFA).
# Se eliminan los drops vanilla del jefe.
# La Esencia Legendaria es el drop principal.
# ============================================================

drops:
  boss:
    # Elimina los drops vanilla del jefe.
    clear-vanilla: true

    essence:
      item: legendary_essence
      amount: 1
      # Usa la probabilidad definida por tier en tiers.yml (10% -> 100%).
      use-tier-chance: true

    # Loot custom extra que suelta el jefe.
    custom-loot:
      enabled: true
      min: 1
      max: 3
      # Usa el tier del jefe para generar el loot.
      use-boss-tier: true

    xp:
      base: 50
      per-tier: 50

    # Tiempo antes de que desaparezcan los items en el suelo.
    despawn-seconds: 300

    # Los drops del jefe no estan protegidos contra lava.
    lava-protected: false

    # Libre para todos.
    free-for-all: true

  # Overrides por jefe. Ejemplo:
  # overrides:
  #   brute_de_piedra:
  #     essence:
  #       amount: 2
  #     xp:
  #       base: 100
  overrides: {}
