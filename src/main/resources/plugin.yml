name: MiPluginBosses
version: 1.0
main: com.tunombre.bossplugin.Main
api-version: '1.21'
description: Plugin de jefes personalizados para Minecraft 26.3 - Wilderness Bound
author: TuNombre

commands:
  boss:
    description: Comando principal para invocar jefes
    usage: /boss <invocar|listar|recargar> [tipo]
    permission: bossplugin.use

permissions:
  bossplugin.use:
    description: Permite usar el comando /boss
    default: op
  bossplugin.admin:
    description: Permite recargar el plugin
    default: op
