# ============================================================
# MiPluginBosses - Loot custom de mobs
# ============================================================
# El loot se decide UNA VEZ al spawnear el mob y se guarda en su PDC.
# Al morir solo se materializa. No se vuelve a tirar.
# La Suerte no influye en ninguna tirada.
# Los drops vanilla se mantienen: esto es loot extra.
# ============================================================

loot:
  enabled: true

  # Los jefes del plugin no usan este sistema.
  exclude-plugin-bosses: true

  # Probabilidad (%) de que un mob reciba loot custom al spawnear.
  drop-chance-by-mob-tier:
    1: 10
    2: 14
    3: 18
    4: 22
    5: 27
    6: 32
    7: 37
    8: 42
    9: 46
    10: 50

  # Probabilidad (%) del tier de loot segun el tier del mob.
  # Filas = tier del mob, columnas = tier del loot (L1..L10).
  # El plugin normaliza si una fila no suma exactamente 100.
  tier-table:
    1:  [30.9, 21.6, 15.1, 10.6,  7.4,  5.2,  3.6,  2.5,  1.8,  1.2]
    2:  [18.0, 25.6, 18.0, 12.6,  8.8,  6.2,  4.3,  3.0,  2.1,  1.5]
    3:  [11.3, 16.2, 23.1, 16.2, 11.3,  7.9,  5.5,  3.9,  2.7,  1.9]
    4:  [ 7.5, 10.7, 15.2, 21.8, 15.2, 10.7,  7.5,  5.2,  3.7,  2.6]
    5:  [ 5.1,  7.3, 10.4, 14.8, 21.2, 14.8, 10.4,  7.3,  5.1,  3.6]
    6:  [ 3.6,  5.1,  7.3, 10.4, 14.8, 21.2, 14.8, 10.4,  7.3,  5.1]
    7:  [ 2.6,  3.7,  5.2,  7.5, 10.7, 15.2, 21.8, 15.2, 10.7,  7.5]
    8:  [ 1.9,  2.7,  3.9,  5.5,  7.9, 11.3, 16.2, 23.1, 16.2, 11.3]
    9:  [ 1.5,  2.1,  3.0,  4.3,  6.2,  8.8, 12.6, 18.0, 25.6, 18.0]
    10: [ 1.2,  1.8,  2.5,  3.6,  5.2,  7.4, 10.6, 15.1, 21.6, 30.9]

  # Peso de cada categoria de item. Debe sumar 100.
  categories:
    armor: 40
    sword: 15
    axe: 10
    tool: 20
    bow: 8
    crossbow: 4
    trident: 2
    shield: 1

  # Piezas posibles por categoria.
  pieces:
    armor: [HELMET, CHESTPLATE, LEGGINGS, BOOTS]
    sword: [SWORD]
    axe: [AXE]
    tool: [PICKAXE, SHOVEL, HOE]
    bow: [BOW]
    crossbow: [CROSSBOW]
    trident: [TRIDENT]
    shield: [SHIELD]

  # Materiales permitidos por pieza.
  # Sin netherite y sin materiales crudos.
  material-applicability:
    LEATHER:  [HELMET, CHESTPLATE, LEGGINGS, BOOTS]
    CHAINMAIL: [HELMET, CHESTPLATE, LEGGINGS, BOOTS]
    COPPER:   [HELMET, CHESTPLATE, LEGGINGS, BOOTS, SWORD, AXE, PICKAXE, SHOVEL, HOE]
    GOLD:     [HELMET, CHESTPLATE, LEGGINGS, BOOTS, SWORD, AXE, PICKAXE, SHOVEL, HOE]
    IRON:     [HELMET, CHESTPLATE, LEGGINGS, BOOTS, SWORD, AXE, PICKAXE, SHOVEL, HOE]
    DIAMOND:  [HELMET, CHESTPLATE, LEGGINGS, BOOTS, SWORD, AXE, PICKAXE, SHOVEL, HOE]

  # Items que conservan su material vanilla y no entran en el sorteo.
  fixed-material-items:
    BOW: WOOD
    CROSSBOW: WOOD
    TRIDENT: PRISMARINE
    SHIELD: WOOD

  # Peso de cada material segun el tier del loot. Debe sumar 100.
  # Si el material no aplica a la pieza sorteada, se ignora y se reparte.
  materials:
    1:  { LEATHER: 45, CHAINMAIL: 20, COPPER: 15, GOLD: 10, IRON: 8,  DIAMOND: 2 }
    2:  { LEATHER: 38, CHAINMAIL: 20, COPPER: 17, GOLD: 11, IRON: 10, DIAMOND: 4 }
    3:  { LEATHER: 30, CHAINMAIL: 20, COPPER: 18, GOLD: 12, IRON: 13, DIAMOND: 7 }
    4:  { LEATHER: 22, CHAINMAIL: 18, COPPER: 19, GOLD: 13, IRON: 17, DIAMOND: 11 }
    5:  { LEATHER: 15, CHAINMAIL: 15, COPPER: 19, GOLD: 13, IRON: 21, DIAMOND: 17 }
    6:  { LEATHER: 10, CHAINMAIL: 12, COPPER: 18, GOLD: 12, IRON: 25, DIAMOND: 23 }
    7:  { LEATHER: 7,  CHAINMAIL: 9,  COPPER: 16, GOLD: 10, IRON: 28, DIAMOND: 30 }
    8:  { LEATHER: 5,  CHAINMAIL: 6,  COPPER: 14, GOLD: 8,  IRON: 30, DIAMOND: 37 }
    9:  { LEATHER: 3,  CHAINMAIL: 4,  COPPER: 11, GOLD: 6,  IRON: 32, DIAMOND: 44 }
    10: { LEATHER: 2,  CHAINMAIL: 3,  COPPER: 8,  GOLD: 4,  IRON: 33, DIAMOND: 50 }

  enchantments:
    # Nivel maximo permitido (incluye niveles superiores al vanilla).
    max-level: 10
    # Permite encantamientos incompatibles entre si.
    allow-incompatible: true
    # Cantidad de encantamientos [min, max] segun el tier del loot.
    count-by-loot-tier:
      1:  [1, 1]
      2:  [1, 2]
      3:  [2, 3]
      4:  [3, 4]
      5:  [4, 5]
      6:  [5, 6]
      7:  [6, 7]
      8:  [7, 8]
      9:  [8, 9]
      10: [9, 10]

  curses:
    # Maldiciones incluidas. Se aplican como los encantamientos:
    # aleatorias y sin comprobar compatibilidad ni utilidad.
    pool: [vanishing_curse, binding_curse]
    ignore-compatibility: true
    # 0, 1 o 2 maldiciones segun el tier del loot. Debe sumar 100.
    count-by-loot-tier:
      1:  { none: 80, one: 18,   two: 2 }
      2:  { none: 82, one: 16,   two: 2 }
      3:  { none: 84, one: 14,   two: 2 }
      4:  { none: 86, one: 12.5, two: 1.5 }
      5:  { none: 88, one: 11,   two: 1 }
      6:  { none: 90, one: 9.5,  two: 0.5 }
      7:  { none: 92, one: 7.5,  two: 0.5 }
      8:  { none: 93, one: 6.5,  two: 0.5 }
      9:  { none: 94, one: 5.5,  two: 0.5 }
      10: { none: 95, one: 4.5,  two: 0.5 }

  # Nombre y lore del item generado.
  display:
    # Placeholders: %tier% %tier_name% %tier_color% %material%
    name: "%tier_color%%name%"
    lore:
      - "%tier_color%* * * Botin %tier_name% * * *"
      - "&7Material: &f%material%"
      - "&7Tier: %tier_color%%tier_roman% &8- %tier_color%%tier_name%"
      - "&8------------------------"
      - "&7Una reliquia que el mundo escondio durante eras."
      - "&7Solo los mas afortunados la ven caer."

  storage:
    type: PDC
    # Serializa el ItemStack completo al spawnear.
    # Garantiza que el loot no cambie aunque se edite la config.
    serialize-item: true
    key: "custom_loot"
    rolled-key: "custom_loot_rolled"
