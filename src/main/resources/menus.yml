# ============================================================
# MiPluginBosses - Menus
# ============================================================
# Menu de jugador y menu de admin separados.
# Todos los slots son configurables.
# Acciones: OPEN_MENU, RUN_COMMAND, SUGGEST_COMMAND, CLOSE
# Acciones dinamicas de admin: ADMIN_BOSS_LIST, BOSS_PICK, BOSS_SPAWN,
# BOSS_COORDS, EGG_ANY, EGG_TIER_PICK, EGG_PICK, EGG_SPAWN, EGG_COORDS,
# ADMIN_PLAYERS, ADMIN_PLAYER, ADMIN_GIVE, ADMIN_UNLOCK, ADMIN_RESET_ALL,
# ADMIN_RESET_TIERS, ADMIN_RESET_TIER y RECIPE.
# ============================================================

menus:

  # Item de relleno.
  fill:
    material: BLACK_STAINED_GLASS_PANE
    name: " "

  # ----------------------------------------------------------
  # Menu del jugador
  # ----------------------------------------------------------
  main:
    title: "&8Menu de Jefes"
    rows: 6
    items:
      recipes:
        slot: 10
        material: CRAFTING_TABLE
        name: "&eRecetas"
        lore:
          - "&7Consulta todas las recetas"
          - "&7de Esencias de Habilidad."
        action: OPEN_MENU
        menu: recipes
      abilities:
        slot: 12
        material: NETHER_STAR
        name: "&bHabilidades"
        lore:
          - "&7Consulta las 27 habilidades,"
          - "&7sus niveles y sus costes."
        action: OPEN_MENU
        menu: abilities
      bosses:
        slot: 14
        material: IRON_SWORD
        name: "&cJefes"
        lore:
          - "&7Consulta los 20 jefes,"
          - "&7sus tiers y habilidades."
        action: OPEN_MENU
        menu: bosses
      progress:
        slot: 28
        material: EXPERIENCE_BOTTLE
        name: "&aMi progreso"
        lore:
          - "&7Tu tier maximo desbloqueado"
          - "&7y los jefes que has derrotado."
        action: OPEN_MENU
        menu: progress
      stats:
        slot: 30
        material: PLAYER_HEAD
        name: "&dMis estadisticas"
        lore:
          - "&7Tus stats base, equipo,"
          - "&7Evolution y totales."
        action: OPEN_MENU
        menu: stats
      help:
        slot: 32
        material: BOOK
        name: "&fAyuda"
        lore:
          - "&7Comandos y guia rapida."
        action: OPEN_MENU
        menu: help
      close:
        slot: 49
        material: BARRIER
        name: "&cCerrar"
        action: CLOSE

  # ----------------------------------------------------------
  # Menu del admin
  # ----------------------------------------------------------
  admin:
    title: "&8Menu de Administracion"
    rows: 6
    items:
      eggs:
        slot: 10
        material: DRAGON_EGG
        name: "&5Huevos"
        lore:
          - "&7Genera un huevo de jefe."
          - "&8/boss huevo [tier] [cantidad]"
        action: OPEN_MENU
        menu: admin_egg
      compass:
        slot: 11
        material: COMPASS
        name: "&bBrujula de Rastreo"
        lore:
          - "&7Entrega la brujula a un jugador."
          - "&8/boss brujula [jugador]"
        action: ADMIN_PLAYERS:COMPASS
      give_essence:
        slot: 12
        material: NETHER_STAR
        name: "&6Dar esencia"
        lore:
          - "&7Entrega una Esencia Legendaria."
          - "&8/boss dar <jugador> <esencia> [cantidad]"
        action: ADMIN_PLAYERS:GIVE
      unlock:
        slot: 13
        material: EXPERIENCE_BOTTLE
        name: "&aDesbloquear tier"
        lore:
          - "&7Desbloquea un tier a un jugador."
          - "&8/boss desbloquear <jugador> <tier>"
        action: ADMIN_PLAYERS:UNLOCK
      reset:
        slot: 14
        material: BARRIER
        name: "&cResetear progreso"
        lore:
          - "&7Resetea el progreso de un jugador."
          - "&8/boss reset <jugador> [tier|all]"
        action: ADMIN_PLAYERS:RESET
      spawn_boss:
        slot: 15
        material: ZOMBIE_HEAD
        name: "&4Invocar jefe"
        lore:
          - "&7Invoca un jefe por su id."
          - "&8/boss jefe <id>"
        action: ADMIN_BOSS_LIST
      reload:
        slot: 16
        material: REDSTONE
        name: "&eRecargar"
        lore:
          - "&7Recarga todos los YAML."
          - "&8/boss recargar"
        action: RUN_COMMAND
        command: "/boss recargar"
      validate:
        slot: 17
        material: WRITABLE_BOOK
        name: "&fValidar configs"
        lore:
          - "&7Comprueba errores en los YAML."
          - "&8/boss validar"
        action: RUN_COMMAND
        command: "/boss validar"
      back:
        slot: 49
        material: ARROW
        name: "&7Volver"
        action: OPEN_MENU
        menu: main

  # ----------------------------------------------------------
  # Submenu: recetas
  # ----------------------------------------------------------
  recipes:
    title: "&8Recetas"
    rows: 6
    paginated: true
    item:
      material: NETHER_STAR
      name: "&e%ability_name%"
      lore:
        - "&7Tier: &e%tier%"
        - "&7Nivel maximo: &e%max_level%"
        - ""
        - "&7Receta:"
        - "&8%recipe%"
        - ""
        - "&eClick para ver el detalle"
    close-slot: 49
    prev-slot: 45
    next-slot: 53
    page-slot: 48

  # ----------------------------------------------------------
  # Submenu: habilidades
  # ----------------------------------------------------------
  abilities:
    title: "&8Habilidades"
    rows: 6
    paginated: true
    item:
      material: NETHER_STAR
      name: "&b%ability_name%"
      lore:
        - "&7%ability_description%"
        - ""
        - "&7Tipo: &e%type%"
        - "&7Tier: &e%tier%"
        - "&7Nivel maximo: &e%max_level%"
        - "&7Coste: &e%cost%"
        - ""
        - "&eClick para ver objetos compatibles"
    close-slot: 49
    prev-slot: 45
    next-slot: 53
    page-slot: 48

  # ----------------------------------------------------------
  # Detalle de habilidad: objetos a los que se puede aplicar
  # ----------------------------------------------------------
  ability_detail:
    title: "&8Habilidad: %ability_name%"
    rows: 6
    items:
      info:
        slot: 13
        material: NETHER_STAR
        name: "&b%ability_name%"
        lore:
          - "&7%ability_description%"
          - ""
          - "&7Tipo: &e%type%"
          - "&7Tier: &e%tier%"
          - "&7Nivel maximo: &e%max_level%"
          - "&7Coste: &e%cost%"
          - "&7Se activa: &e%trigger%"
      compatible:
        slot: 22
        material: ANVIL
        name: "&eObjetos compatibles"
        lore:
          - "&7Puedes aplicar esta habilidad a:"
          - ""
          - "%compatible%"
          - ""
          - "&8Usa una esencia sobre el objeto"
          - "&8o combinalos en la mesa de crafteo."
      back:
        slot: 49
        material: ARROW
        name: "&7Volver a habilidades"
        action: OPEN_MENU
        menu: abilities

  # ----------------------------------------------------------
  # Submenu: jefes (bestiario)
  # ----------------------------------------------------------
  bosses:
    title: "&8Jefes"
    rows: 6
    paginated: true
    item:
      material: ZOMBIE_HEAD
      name: "%tier_color%%boss_name%"
      lore:
        - "&7Tier: %tier_color%%tier_name%"
        - "&7Arquetipo: &e%archetype%"
        - ""
        - "&7Habilidades:"
        - "&8%abilities%"
        - ""
        - "&7Vida: &c%health% &7- Dano: &c%damage%"
    close-slot: 49
    prev-slot: 45
    next-slot: 53
    page-slot: 48

  # ----------------------------------------------------------
  # Submenu: progreso
  # ----------------------------------------------------------
  progress:
    title: "&8Mi progreso"
    rows: 6
    items:
      tier:
        slot: 13
        material: EXPERIENCE_BOTTLE
        name: "&aTier maximo: &e%tier%"
        lore:
          - "&7Jefes derrotados: &e%killed%&7/&e%total%"
          - "&7Progreso del tier: &e%tier_progress%"
      bosses:
        slot: 22
        material: IRON_SWORD
        name: "&cJefes derrotados"
        lore:
          - "%boss_list%"
      close:
        slot: 49
        material: BARRIER
        name: "&cCerrar"
        action: CLOSE

  # ----------------------------------------------------------
  # Submenu: estadisticas
  # ----------------------------------------------------------
  stats:
    title: "&8Mis estadisticas"
    rows: 6
    stats:
      health:
        slot: 10
        material: GOLDEN_APPLE
        name: "&cVida maxima"
        stat: max_health
        lore: &stat_lore
          - "&7Base: &f%base%"
          - "&7Equipo: &f%equipment%"
          - "&7Evolution: &a+%evolution%"
          - "&8----------------"
          - "&7Total: &e%total%"
          - "&7Puntos: &e%points%&7/&e%max_points%"
          - "&7Mejora por punto: &a+%increment%"
      armor:
        slot: 11
        material: IRON_CHESTPLATE
        name: "&7Armadura"
        stat: armor
        lore: *stat_lore
      toughness:
        slot: 12
        material: DIAMOND_CHESTPLATE
        name: "&7Dureza"
        stat: toughness
        lore: *stat_lore
      attack_damage:
        slot: 13
        material: IRON_SWORD
        name: "&cDano de ataque"
        stat: attack_damage
        lore: *stat_lore
      attack_speed:
        slot: 14
        material: FEATHER
        name: "&eVelocidad de ataque"
        stat: attack_speed
        lore: *stat_lore
      movement_speed:
        slot: 15
        material: SUGAR
        name: "&bVelocidad"
        stat: movement_speed
        lore: *stat_lore
      knockback_resistance:
        slot: 16
        material: SHIELD
        name: "&7Resistencia al empuje"
        stat: knockback_resistance
        lore: *stat_lore
      luck:
        slot: 17
        material: RABBIT_FOOT
        name: "&aLuck"
        stat: luck
        lore: *stat_lore
    player_head:
      slot: 4
      material: PLAYER_HEAD
      name: "&e%player%"
      lore:
        - "&7Tier maximo: &e%tier%"
        - "&7Puntos de Evolution: &e%points%"
    evolution:
      slot: 22
      material: NETHER_STAR
      name: "&5Evolution"
      lore:
        - "&7Nivel: &e%evolution_level%"
        - "&7Equipada: %evolution_equipped%"
        - "&7Puntos: &e%points%&7/&e%max_points%"
        - "&7Stats al maximo: &e%maxed%"
        - ""
        - "%evolution_progress%"
    refresh:
      slot: 48
      material: SUNFLOWER
      name: "&aRefrescar"
      action: REFRESH
    close:
      slot: 50
      material: BARRIER
      name: "&cCerrar"
      action: CLOSE

  # ----------------------------------------------------------
  # Submenu: ayuda
  # ----------------------------------------------------------
  help:
    title: "&8Ayuda"
    rows: 6
    items:
      commands:
        slot: 13
        material: BOOK
        name: "&eComandos de jugador"
        lore:
          - "&8/boss menu &7- Abre este menu"
          - "&8/boss stats &7- Tus estadisticas"
          - "&8/boss progreso &7- Tu progreso"
          - "&8/boss ayuda &7- Esta ayuda"
      progression:
        slot: 22
        material: EXPERIENCE_BOTTLE
        name: "&aComo progresar"
        lore:
          - "&7Abre huevos de jefe por el mundo."
          - "&7Derrota a los 2 jefes de tu tier"
          - "&7para desbloquear el siguiente."
      close:
        slot: 49
        material: BARRIER
        name: "&cCerrar"
        action: CLOSE

  # ----------------------------------------------------------
  # Admin: elegir jefe para invocar
  # ----------------------------------------------------------
  admin_bosses:
    title: "&8Invocar jefe - Elige jefe"
    rows: 6
    paginated: true
    item:
      material: ZOMBIE_HEAD
      name: "%tier_color%%boss_name%"
      lore:
        - "&7Tier: %tier_color%%tier_name%"
        - "&7Arquetipo: &e%archetype%"
        - "&7Vida: &c%health% &7- Dano: &c%damage%"
        - ""
        - "&eClick para elegir ubicacion"
    close-slot: 49
    prev-slot: 45
    next-slot: 53
    page-slot: 48

  # ----------------------------------------------------------
  # Admin: elegir ubicacion del jefe
  # ----------------------------------------------------------
  admin_boss_location:
    title: "&8Invocar %tier_color%%boss_name%"
    rows: 3
    items:
      here:
        slot: 11
        material: GRASS_BLOCK
        name: "&aAqui mismo"
        lore:
          - "&7Invoca el jefe en tu posicion."
        action: "BOSS_SPAWN:%boss_id%:here"
      random:
        slot: 13
        material: ENDER_PEARL
        name: "&eAleatorio cerca"
        lore:
          - "&7Invoca el jefe en un lugar"
          - "&7seguro a menos de 16 bloques."
        action: "BOSS_SPAWN:%boss_id%:random"
      coords:
        slot: 15
        material: MAP
        name: "&bCoordenadas exactas"
        lore:
          - "&7Escribe &eX Y Z &7en el chat."
        action: "BOSS_COORDS:%boss_id%"
      back:
        slot: 22
        material: ARROW
        name: "&7Volver"
        action: ADMIN_BOSS_LIST

  # ----------------------------------------------------------
  # Admin: menu de huevos
  # ----------------------------------------------------------
  admin_egg:
    title: "&8Generar huevo"
    rows: 3
    items:
      any:
        slot: 11
        material: DRAGON_EGG
        name: "&5Tier aleatorio"
        lore:
          - "&7Genera un huevo de un tier"
          - "&7aleatorio segun tu progreso."
        action: EGG_ANY
      by_tier:
        slot: 13
        material: EXPERIENCE_BOTTLE
        name: "&aElegir tier"
        lore:
          - "&7Genera un huevo de un tier"
          - "&7concreto."
        action: ADMIN_EGG_TIERS
      by_boss:
        slot: 15
        material: ZOMBIE_HEAD
        name: "&cElegir jefe"
        lore:
          - "&7Genera un huevo que siempre"
          - "&7abre un jefe concreto."
        action: ADMIN_EGG_BOSSES
      back:
        slot: 22
        material: ARROW
        name: "&7Volver"
        action: OPEN_MENU
        menu: admin

  # ----------------------------------------------------------
  # Admin: elegir tier de huevo
  # ----------------------------------------------------------
  admin_egg_tiers:
    title: "&8Huevo - Elige tier"
    rows: 6
    paginated: true
    item:
      material: EXPERIENCE_BOTTLE
      name: "%tier_color%Tier %tier% &7- %tier_name%"
      lore:
        - "&7Jefes en este tier: &e%bosses%"
        - ""
        - "&eClick para elegir ubicacion"
    close-slot: 49
    prev-slot: 45
    next-slot: 53
    page-slot: 48

  # ----------------------------------------------------------
  # Admin: elegir jefe del huevo
  # ----------------------------------------------------------
  admin_egg_bosses:
    title: "&8Huevo - Elige jefe"
    rows: 6
    paginated: true
    item:
      material: ZOMBIE_HEAD
      name: "%tier_color%%boss_name%"
      lore:
        - "&7Tier: %tier_color%%tier_name%"
        - "&7Arquetipo: &e%archetype%"
        - ""
        - "&eClick para elegir ubicacion"
    close-slot: 49
    prev-slot: 45
    next-slot: 53
    page-slot: 48

  # ----------------------------------------------------------
  # Admin: ubicacion del huevo
  # ----------------------------------------------------------
  admin_egg_location:
    title: "&8Huevo: %egg_label%"
    rows: 3
    items:
      here:
        slot: 11
        material: GRASS_BLOCK
        name: "&aAqui mismo"
        lore:
          - "&7Coloca el huevo a tu alrededor."
        action: "EGG_SPAWN:%egg_tier%:%egg_boss%:here"
      random:
        slot: 13
        material: ENDER_PEARL
        name: "&eAleatorio cerca"
        lore:
          - "&7Coloca el huevo en la superficie"
          - "&7a menos de 20 bloques."
        action: "EGG_SPAWN:%egg_tier%:%egg_boss%:random"
      coords:
        slot: 15
        material: MAP
        name: "&bCoordenadas exactas"
        lore:
          - "&7Escribe &eX Y Z &7en el chat."
        action: "EGG_COORDS:%egg_tier%:%egg_boss%"
      back:
        slot: 22
        material: ARROW
        name: "&7Volver"
        action: ADMIN_EGG

  # ----------------------------------------------------------
  # Admin: elegir jugador
  # ----------------------------------------------------------
  admin_players:
    title: "&8Elige un jugador"
    rows: 6
    paginated: true
    item:
      material: PLAYER_HEAD
      name: "&e%player%"
      lore:
        - "&7Tier maximo: &e%tier%"
        - "&7Puntos: &e%points%"
        - ""
        - "&eClick para continuar"
    close-slot: 49
    prev-slot: 45
    next-slot: 53
    page-slot: 48

  # ----------------------------------------------------------
  # Admin: elegir esencia
  # ----------------------------------------------------------
  admin_abilities:
    title: "&8Dar esencia a %target%"
    rows: 6
    paginated: true
    item:
      material: NETHER_STAR
      name: "&b%ability_name%"
      lore:
        - "&7Tipo: &e%type%"
        - "&7Tier: &e%tier%"
        - "&7Nivel maximo: &e%max_level%"
        - "&7Coste: &e%cost%"
        - ""
        - "&eClick para entregar 1 esencia"
    close-slot: 49
    prev-slot: 45
    next-slot: 53
    page-slot: 48

  # ----------------------------------------------------------
  # Admin: desbloquear tier
  # ----------------------------------------------------------
  admin_unlock_tiers:
    title: "&8Desbloquear tier a %target%"
    rows: 6
    paginated: true
    item:
      material: EXPERIENCE_BOTTLE
      name: "%tier_color%Tier %tier% &7- %tier_name%"
      lore:
        - "&eClick para desbloquear"
    close-slot: 49
    prev-slot: 45
    next-slot: 53
    page-slot: 48

  # ----------------------------------------------------------
  # Admin: resetear progreso
  # ----------------------------------------------------------
  admin_reset:
    title: "&8Resetear a %target%"
    rows: 3
    items:
      all:
        slot: 11
        material: TNT
        name: "&cResetear todo"
        lore:
          - "&7Borra todo el progreso de"
          - "&e%target%&7."
        action: "ADMIN_RESET_ALL:%target%"
      tier:
        slot: 15
        material: BARRIER
        name: "&eResetear un tier"
        lore:
          - "&7Elige el tier a resetear."
        action: "ADMIN_RESET_TIERS:%target%"
      back:
        slot: 22
        material: ARROW
        name: "&7Volver"
        action: "ADMIN_PLAYERS:RESET"

  # ----------------------------------------------------------
  # Admin: elegir tier a resetear
  # ----------------------------------------------------------
  admin_reset_tiers:
    title: "&8Resetear tier de %target%"
    rows: 6
    paginated: true
    item:
      material: BARRIER
      name: "%tier_color%Tier %tier% &7- %tier_name%"
      lore:
        - "&eClick para resetear este tier"
    close-slot: 49
    prev-slot: 45
    next-slot: 53
    page-slot: 48

  # ----------------------------------------------------------
  # Vista previa de receta (mesa de crafteo 3x3)
  # ----------------------------------------------------------
  recipe_preview:
    title: "&8Receta: %ability_name%"
    rows: 6
    # Slots del grid 3x3 dentro del menu.
    grid-slots: [10, 11, 12, 19, 20, 21, 28, 29, 30]
    result-slot: 24
    items:
      info:
        slot: 4
        material: NETHER_STAR
        name: "&e%ability_name%"
        lore:
          - "&7Tier: &e%tier%"
          - "&7Nivel maximo: &e%max_level%"
          - ""
          - "&7Patron:"
          - "&8A = material principal (x4)"
          - "&8B = material secundario (x4)"
          - "&8E = Esencia Legendaria"
      back:
        slot: 49
        material: ARROW
        name: "&7Volver a recetas"
        action: OPEN_MENU
        menu: recipes
